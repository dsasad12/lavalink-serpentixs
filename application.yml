server:
  port: 8080
  address: 0.0.0.0
lavalink:
  server:
    password: "tu_contrasena_segura"
    sources:
      youtube: false # Se pone en false porque el plugin se encarga ahora
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      mixer: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistPageLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    scSearchEnabled: true
  plugins: # Mantenlo alineado con 'server'
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.11.4"
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics
sentry:
  dsn: ""
  environment: ""
logging:
  file:
    path: ./logs/lavalink.log
  level:
    root: INFO
    lavalink: INFO
